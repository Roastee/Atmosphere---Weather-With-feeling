name: Bug report
description: Report a reproducible problem with the weather workspace.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please remove credentials, tokens, personal data, and other sensitive information before submitting logs or screenshots.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and the user-visible impact.
      placeholder: Tell us what went wrong.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence of steps, including the selected location or view when relevant.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include exact error text when available.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Where did this happen?
      options:
        - Local development
        - GitHub Actions
        - Preview or deployment
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: For browser problems, include the browser name and version.
      placeholder: Chrome 140, Firefox 142, Safari 18, or not applicable

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste redacted logs or attach screenshots. Do not include secrets or personal data.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed credentials, tokens, and other sensitive information from this report.
          required: true
